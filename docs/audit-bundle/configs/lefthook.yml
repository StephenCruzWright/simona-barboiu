# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx biome check --write --no-errors-on-unmatched --staged {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit

    - name: gitleaks
      tags: secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo ''
          echo '[gitleaks] not installed locally. Pre-commit secret scan cannot run.'
          echo ''
          echo 'Install:'
          echo '  Windows:  winget install gitleaks.gitleaks'
          echo '  macOS:    brew install gitleaks'
          echo '  Linux:    https://github.com/gitleaks/gitleaks/releases'
          echo ''
          echo 'Or skip this hook (CI still scans every PR):'
          echo '  LEFTHOOK_EXCLUDE=gitleaks git commit ...'
          echo ''
          exit 1
        fi
        gitleaks protect --staged --redact --no-banner

pre-push:
  jobs:
    - name: biome-ci
      run: npx biome ci .
